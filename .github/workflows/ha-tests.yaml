name: HA runtime tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ha-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ha-tests:
    name: Real HA tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - name: Install isolated HA test environment
        run: python -m pip install -r tests/requirements-ha.txt
      - name: Frontend regression tests (no HA calls)
        run: |
          node --version
          node tests/player_card_artwork.cjs
          node tests/tnt_reminder_errors.cjs
      - name: Quality Scale inventory validation
        run: python -B tests/validate_quality_scale.py
      - name: HA tests (device network blocked by test plugin)
        run: >-
          python -m pytest -q tests/ha --disable-warnings -W error::RuntimeWarning
          --cov=custom_components.freebox_homexa --cov-branch
          --cov-report=term --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-quality-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
