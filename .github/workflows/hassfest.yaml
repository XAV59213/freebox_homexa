name: Validate with hassfest

on:
  push:
    branches: [main]
    paths:
      - "custom_components/freebox_homexa/**"
      - ".github/workflows/hassfest.yaml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: hassfest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: hassfest
        uses: home-assistant/actions/hassfest@master
