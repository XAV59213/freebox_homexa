# Action metadata only: runtime handlers and targeting behavior unchanged.
reboot:
  name: Restart Freebox
  description: Reboots the Freebox router.
  fields:
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
reload:
  name: Reload Freebox Homexa
  description: Reload the integration, reconnect to the Freebox and rediscover Home devices.
  fields:
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
remote:
  name: Send remote command
  description: Send remote keys to the Freebox Player (same path as the Remote entity).
  fields:
    code:
      required: true
      example: power
      selector:
        text: null
    player_id:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
    device_id:
      required: false
      selector:
        device:
          integration: freebox_homexa
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
start_fxs_ring:
  name: Start FXS ring
  description: >-
    Rings the phone plugged into the Freebox FXS port. Requires the Telephony
    permission. With a duration, Homexa always calls stop, including on error,
    cancellation or unload.
  fields:
    duration:
      name: Duration
      description: >-
        Ring duration in seconds, from 1 to 300. Omit it to keep ringing until
        stop. When set, stop is always requested.
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: s
          mode: box
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
stop_fxs_ring:
  name: Stop FXS ring
  description: >-
    Stops the FXS phone ring. Requires the Telephony permission. Does not read
    call logs or caller names.
  fields:
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
start_dect_ring:
  name: Ring DECT handsets
  description: >-
    Rings the Freebox DECT handsets. Requires the Telephony permission. Duration
    defaults to 30 seconds. Stop is always requested, including on error,
    cancellation or unload.
  fields:
    duration:
      name: Duration
      description: >-
        Ring duration in seconds, from 1 to 300. Defaults to 30 when omitted.
        Stop is always requested.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: s
          mode: box
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
stop_dect_ring:
  name: Stop DECT ring
  description: >-
    Stops the DECT handset ring. Requires the Telephony permission. Does not
    read call logs, caller names or phone numbers.
  fields:
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
mark_voicemail_read:
  name: Mark voicemail as read
  description: >-
    Marks one Freebox voicemail as read. Requires the Telephony permission.
  fields:
    id:
      name: Message
      description: Opaque message token from the card, the event or the media source. The Freebox file name is not accepted.
      required: true
      selector:
        text: {}
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
delete_voicemail:
  name: Delete voicemail
  description: Deletes one Freebox voicemail. Requires the Telephony permission.
  fields:
    id:
      name: Message
      description: Opaque message token from the card, the event or the media source. The Freebox file name is not accepted.
      required: true
      selector:
        text: {}
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
play_voicemail:
  name: Play voicemail
  description: >-
    Plays one voicemail on a media player, then marks it as read. Alexa or Echo
    playback is best effort and needs a public HTTPS URL (Nabu Casa or an
    external URL).
  fields:
    id:
      name: Message
      description: Opaque message token from the card, the event or the media source. The Freebox file name is not accepted.
      required: true
      selector:
        text: {}
    entity_id:
      name: Media player
      description: media_player entity that should play the message.
      required: true
      selector:
        entity:
          domain: media_player
    config_entry_id:
      name: Integration entry
      description: Optional Homexa config entry ID. Selects the entry without changing its configuration.
      required: false
      selector:
        text: {}
    device_id:
      name: Homexa device
      description: Optional Homexa device used to select the integration entry.
      required: false
      selector:
        device:
          integration: freebox_homexa
schedule_reminder:
  name: Schedule reminder
  description: Programme un rappel avant le debut d'un programme (notification et/ou annonce vocale).
  fields:
    channel_name:
      name: Channel name
      description: Nom affiche de la chaine.
      required: true
      example: TF1
      selector:
        text: null
    program_title:
      name: Program title
      description: Titre du programme.
      required: true
      example: Le 20h
      selector:
        text: null
    start_time:
      name: Start time
      description: Heure de début au format ISO 8601 avec fuseau horaire.
      required: true
      example: '2026-09-01T20:00:00+02:00'
      selector:
        text: null
    minutes_before:
      name: Minutes before
      description: Nombre de minutes avant le debut auquel envoyer le rappel (5, 10 ou 15).
      required: true
      example: 10
      selector:
        number:
          min: 5
          max: 15
          step: 5
          unit_of_measurement: min
          mode: box
    profile_name:
      name: Profile name
      description: Nom du profil de rappel (personne/appareils) configure dans Freebox Homexa → Configurer → Profils
        de rappel. Facultatif s'il n'existe qu'un seul profil.
      required: false
      example: Fred
      selector:
        text: null
cancel_reminder:
  name: Cancel reminder
  description: Annule un rappel precedemment programme.
  fields:
    channel_name:
      name: Channel name
      description: Nom affiche de la chaine.
      required: true
      example: TF1
      selector:
        text: null
    program_title:
      name: Program title
      description: Titre du programme.
      required: true
      example: Le 20h
      selector:
        text: null
    start_time:
      name: Start time
      description: Heure de début au format ISO 8601 avec fuseau horaire.
      required: true
      example: '2026-09-01T20:00:00+02:00'
      selector:
        text: null
    minutes_before:
      name: Minutes before
      description: Delai (en minutes) du rappel a annuler (5, 10 ou 15).
      required: true
      example: 10
      selector:
        number:
          min: 5
          max: 15
          step: 5
          unit_of_measurement: min
          mode: box
    profile_name:
      name: Profile name
      description: Nom du profil de rappel (personne/appareils) concerne. Doit correspondre a celui utilise pour
        programmer le rappel.
      required: false
      example: Fred
      selector:
        text: null
get_reminder_status:
  name: Get reminder status
  description: Renvoie la liste des delais (en minutes) pour lesquels un rappel est actuellement programme sur ce
    programme.
  fields:
    channel_name:
      name: Channel name
      description: Nom affiche de la chaine.
      required: true
      example: TF1
      selector:
        text: null
    program_title:
      name: Program title
      description: Titre du programme.
      required: true
      example: Le 20h
      selector:
        text: null
    start_time:
      name: Start time
      description: Heure de début au format ISO 8601 avec fuseau horaire.
      required: true
      example: '2026-09-01T20:00:00+02:00'
      selector:
        text: null
    profile_name:
      name: Profile name
      description: Nom du profil de rappel (personne/appareils) concerne. Doit correspondre a celui utilise pour
        programmer le rappel.
      required: false
      example: Fred
      selector:
        text: null
