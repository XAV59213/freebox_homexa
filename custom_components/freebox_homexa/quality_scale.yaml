# Autoévaluation prudente, 2026-11-09, base da2938c (28.8.91), préparation 28.8.92.
# Custom HACS : aucune certification Bronze/Silver/Gold/Platinum officielle.
# HACS accepté != Integration Quality Scale core. done = preuve locale limitée
# à la règle ; todo inclut les preuves insuffisantes, pas seulement les défauts.
# Liste et schéma HA core : 49693fc6644b3555fdaaf9fe30a973517a0a9d4e
# script/hassfest/quality_scale.py ; 54 règles (20/10/21/3).
# Détails, limites et commande de validation : docs/quality-scale-audit.md.
rules:
  action-setup:
    status: done
    comment: services.py:async_setup_services et tnt_reminders.py:async_setup_reminders sont appelés depuis
      __init__.py:async_setup. tests/ha/test_service_registration.py prouve six services enregistrés une seule
      fois après deux setups sans entrée. Les rappels sont idempotents et les services persistent après unload.
  appropriate-polling:
    status: done
    comment: "Le formulaire ne demande plus l'intervalle Home. Une entree nouvelle utilise 15 s. Une valeur deja enregistree est recopiee telle quelle a l'enregistrement des autres options. tests/ha/test_options_flow.py."
  brands:
    status: exempt
    comment: "Règle core : les images vont dans home-assistant/brands, dossier core_integrations. Homexa est une intégration HACS, ce dépôt ne la publie pas. Les logos YouTube/Netflix du dépôt sont des icônes d'applications, pas la marque de l'intégration. Exemption du canal core, pas une certification. Réévaluer si Homexa est proposée au core."
  common-modules:
    status: done
    comment: const.py:1-68 centralise domaine, plateformes et constantes ; entity.py:1-225 et availability.py
      regroupent les bases communes.
  config-flow:
    status: done
    comment: manifest.json:12 config_flow=true ; config_flow.py:180-225 ConfigFlow avec formulaire user. Constat
      structurel, pas preuve de couverture du flow.
  config-flow-test-coverage:
    status: done
    comment: 'Jalon19 : config_flow.py477/477lignes et164/164branches100%. Entrée de profil décrite par
      TypedDict exact validé par le schéma HA public avant callback ; validation dupliquée inaccessible
      retirée, sans pragma ni bypass. Vrai manager HA refuse notify_target malformé par InvalidData sans
      mutation, puis corrige et termine le même flow. Succès/erreurs/reprises et unique_id des autres
      flows conservés. Les réserves identité physique/reauth restent dans leurs règles distinctes.'
  dependency-transparency:
    status: todo
    comment: 'Source GPL-3.0 tag v1.3.1 commit 96322885f37df37e6f491ab889b27cf912cc293a ; wheel PyPI SHA256
      fb438c44d08293d7ca1a3d9ad55334a3e2905bdda270332345b7e30a1afbfa87, gh attestation verify réussi contre
      hacf-fr/freebox-api. Provenance signée liée au même commit et au run public release.yml 23742463862
      réussi : transparence démontrée pour le SDK testé 1.3.1. Réserve formelle précise : règle core demande
      pin exact mais hassfest custom refuse ce pin pour dépendance partagée avec HA (run 42400842458). Minimum
      freebox-api>=1.3.1 conservé, pas validation désactivée ni exemption artificielle ; nouvelles versions
      à réauditer. Détails et hashes dans docs/quality-scale-source-contracts.md.'
