    status: done
    comment: "L'entrée nouvelle prend la MAC lue dans system.get_config, formatée par format_mac, jamais l'hôte. Un second appairage de la même MAC avorte. La même adresse saisie deux fois avorte avant l'appairage. Une entrée historique dont l'identifiant est encore l'hôte est adoptée au setup, à la réauthentification ou à la reconfiguration, sans changer les entity_id ni les options. tests/ha/test_config_flow.py."
  action-exceptions:
    status: done
    comment: 'errors.py:async_action_errors garde les 42 frontières explicites inventoriées par AST sur 11
      modules (actions entités, six services, lecture calendrier et reboot routeur). Validation HA et annulation
      préservées ; erreurs SDK/données traduites sans payload, état optimiste non changé en échec. tests/ha/test_action_errors.py
      : 103 cas vrai HA, succès/échec/récupération des familles, appels services réels, contrats SDK Remote
      et Store publics. False du SDK remote = commande non confirmée (elle peut avoir été exécutée), erreur
