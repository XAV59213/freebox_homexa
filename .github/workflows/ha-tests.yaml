name: HA runtime tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ha-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ha-tests:
    name: Real HA tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - name: Install isolated HA test environment
        run: python -m pip install -r tests/requirements-ha.txt
      - name: Frontend regression tests (no HA calls)
        run: |
          node --version
          node tests/player_card_artwork.cjs
          node tests/tnt_reminder_errors.cjs
          node tests/phone_card.cjs
          node tests/server_card.cjs
      - name: Quality Scale inventory validation
        run: python -B tests/validate_quality_scale.py
      - name: HA tests (device network blocked by test plugin)
        run: >-
          python -m pytest -q tests/ha --disable-warnings -W error::RuntimeWarning
          --cov=custom_components.freebox_homexa --cov-branch
          --cov-report=term --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-quality-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
  ha-tests-202611:
    name: Real HA 2026.11.2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # sitecustomize : alias httpx2 avant les plugins, et _clear_logger_overwrites.
      PYTHONPATH: ${{ github.workspace }}/tests/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ha.txt
      - name: Install HA 2026.11.2 test environment
        run: |
          python -m pip install -r tests/requirements-ha.txt
          # pytest-homeassistant-custom-component 0.13.375 pins 2026.10.4 and
          # has no 2026.11 release. Force this core, then install its own deps.
          python -m pip install --upgrade --force-reinstall --no-deps homeassistant==2026.11.2
          python -c 'import importlib.metadata as md; reqs=[raw.split(";", 1)[0].strip() for raw in (md.requires("homeassistant") or [])]; open("/tmp/ha-202611-reqs.txt", "w").write("\n".join(reqs) + "\n")'
          python -m pip install -r /tmp/ha-202611-reqs.txt
          python -c "import importlib.metadata as m; assert m.version('homeassistant') == '2026.11.2'"
      - name: HA tests on 2026.11.2 (device network blocked by test plugin)
        run: >-
          python -m pytest -q tests/ha --disable-warnings -W error::RuntimeWarning
          --cov=custom_components.freebox_homexa --cov-branch
          --cov-report=term --cov-report=json:coverage-202611.json --cov-report=xml:coverage-202611.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-202611-coverage
          path: |
            coverage-202611.json
            coverage-202611.xml
          if-no-files-found: warn
