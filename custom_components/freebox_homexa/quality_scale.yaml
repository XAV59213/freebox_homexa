      supprime pas le timer si persistance échoue. Tests camera/cover/local inversion du lot 4 conservés ;
      aucune preuve de réussite physique revendiquée. Lot 6 : mêmes contrôles de persistance réelle sur cache
      partagé avant reboot/reload/unload ; échec Store détecté avant commande/teardown. Rappels : écriture
      réussie mais relecture échouée reste erreur utilisateur ; status refuse désaccord stockage/minuteur.
      Remplacement annule ancien minuteur, restauration préserve champs non concernés. Erreur de status visible
      dans la carte (plus de catch silencieux), tests JS sans appel HA.'
