    status: done
    comment: "async_unload_entry decharge les plateformes puis appelle router.close, qui appelle le close public du SDK. Ce close ferme la session apres la deconnexion. tests/ha/test_lifecycle.py et tests/ha/test_all_platform_unload.py verifient que close est attendu quand le dechargement reussit, et pas quand il echoue."
