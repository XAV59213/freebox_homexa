# Freebox Homexa — vue basée sur tes entités HA
# Volets, Player, contacts Home, SMS XA
#
# Prérequis : Mushroom + Free Mobile SMS XA
# Optionnel : auto-entities (pour lister alarme / PIR / RSSI Homexa)

title: Homexa
path: homexa
icon: mdi:router-wireless
type: masonry
cards:
  - type: custom:auto-entities
    card:
      type: grid
      columns: 1
      square: false
    card_param: cards
    filter:
      include:
        - integration: freebox_homexa
          domain: alarm_control_panel
          options:
            type: custom:mushroom-alarm-control-panel-card
            name: Alarme
            icon: mdi:shield-home-outline
            states:
              - armed_home
              - armed_away
              - disarmed
            layout: horizontal
            show_keypad: false
    show_empty: false

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-cover-card
        entity: cover.volet_salon
        name: Volet salon
        show_buttons_control: true
        show_position_control: false
        layout: horizontal
      - type: custom:mushroom-cover-card
        entity: cover.volet_cuisine
        name: Volet cuisine
        show_buttons_control: true
        show_position_control: false
        layout: horizontal
      - type: custom:mushroom-cover-card
        entity: cover.volet_papa
        name: Volet papa
        show_buttons_control: true
        show_position_control: false
        layout: horizontal
      - type: custom:mushroom-cover-card
        entity: cover.volet_fille
        name: Volet fille
        show_buttons_control: true
        show_position_control: false
        layout: horizontal
      - type: custom:mushroom-cover-card
        entity: cover.volet_loulou
        name: Volet loulou
        show_buttons_control: true
        show_position_control: false
        layout: horizontal
      - type: custom:mushroom-cover-card
        entity: cover.volets_maison
        name: Volets maison
        show_buttons_control: true
        show_position_control: false
        layout: horizontal

  - type: vertical-stack
    cards:
      - type: custom:mushroom-media-player-card
        entity: media_player.freebox_player
        name: Freebox Player
        icon: mdi:television-play
        use_media_info: true
        media_controls:
          - previous
          - play_pause_stop
          - next
        volume_controls: []
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:youtube
            icon_color: red
            content: YouTube
            tap_action:
              action: call-service
              service: media_player.select_source
              target:
                entity_id: media_player.freebox_player
              data:
                source: YouTube
          - type: template
            icon: mdi:netflix
            icon_color: red
            content: Netflix
            tap_action:
              action: call-service
              service: media_player.select_source
              target:
                entity_id: media_player.freebox_player
              data:
                source: Netflix
          - type: template
            icon: mdi:amazon
            icon_color: blue
            content: prime
            tap_action:
              action: call-service
              service: media_player.play_media
              target:
                entity_id: media_player.freebox_player
              data:
                media_content_type: url
                media_content_id: https://www.primevideo.com

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: binary_sensor.porte_entree
        name: Porte entrée
        icon: mdi:door
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.porte_cuisine
        name: Porte cuisine
        icon: mdi:door
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.baie_vitree
        name: Baie vitrée
        icon: mdi:door-sliding
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.fenetre_cuisine
        name: Fenêtre cuisine
        icon: mdi:window-closed-variant
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.fenetre_papa
        name: Fenêtre papa
        icon: mdi:window-closed-variant
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.fenetre_loulous
        name: Fenêtre loulous
        icon: mdi:window-closed-variant
        layout: vertical
      - type: custom:mushroom-entity-card
        entity: binary_sensor.porte_fenetre_filles
        name: Porte fenêtre filles
        icon: mdi:door-sliding
        layout: vertical

  - type: custom:auto-entities
    card:
      type: grid
      columns: 3
      square: false
    card_param: cards
    filter:
      include:
        - integration: freebox_homexa
          domain: binary_sensor
          attributes:
            device_class: motion
          options:
            type: custom:mushroom-template-card
            primary: "{{ state_attr(entity, 'friendly_name') }}"
            secondary: "{{ 'Actif' if is_state(entity, 'on') else 'Inactif' }}"
            icon: mdi:walk
            icon_color: "{{ 'red' if is_state(entity, 'on') else 'disabled' }}"
            layout: vertical
    show_empty: false

  - type: custom:auto-entities
    card:
      type: entities
      title: Signal Wi-Fi (RSSI Homexa)
    filter:
      include:
        - integration: freebox_homexa
          domain: sensor
          attributes:
            device_class: signal_strength
    sort:
      method: state
      numeric: true
    show_empty: false

  - type: custom:freesmsxa-send-card
    title: Envoyer un SMS
