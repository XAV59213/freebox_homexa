# Freebox service entries description.

reboot:
  name: "Restart Freebox"
  description: "Reboots the Freebox router."

reload:
  name: "Reload Freebox Homexa"
  description: "Reload the integration, reconnect to the Freebox and rediscover Home devices."

remote:
  description: Call remote code to the Freebox Player
  fields:
    code:
      description: Code Number
      example: 'power'
